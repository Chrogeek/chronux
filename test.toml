[input]
svg = "input.svg"
map = "map.png"

[output]
width = 1920
height = 1080
fps = 30
duration = 10.0  # 总时长（秒）

[[events]]
id = "camera_zoom"
type = "camera"
duration = 2.0
start = 0.0  # 可选，不设置则用trigger
curve = { bezier = [0.25, 0.1, 0.25, 1.0] }  # 或 preset = "ease_out"
params = { viewport_start = [100, 200, 800, 600], viewport_end = [300, 400, 800, 600], scale_start = 1.0, scale_end = 1.5 }

[[events]]
id = "path_animation"
type = "trim_path"
duration = 1.5
trigger = { event = "camera_zoom", offset = 0.5 }  # 相对触发
params = { target = "path-1", start = 0.0, end = 1.0 }

[[events]]
id = "text_fade"
type = "fade"
duration = 1.0
trigger = { event = "path_animation", mode = "after_end", offset = 0.2 }
params = { target = "text-1", opacity_start = 0.0, opacity_end = 1.0 }

[[viewports]]
default = { x = 0, y = 0, width = 1920, height = 1080 }
