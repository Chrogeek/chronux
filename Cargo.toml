[package]
name = "chronux"
version = "0.5.0"
edition = "2024"

[dependencies]
clap = "4.5.40"
clap_derive = "4.5.40"
csscolorparser = "0.7.2"
env_logger = "0.11.8"
image = "0.25.6"
indicatif = { version = "0.17.11", features = ["rayon"] }
itertools = "0.14.0"
log = "0.4.27"
once_cell = "1.21.3"
pariter = "0.5.1"
rayon = "1.10.0"
roots = "0.0.8"
roxmltree = "0.20.0"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_with = "3.14.0"
simplecss = "0.2.2"
skia-safe = { version = "0.87", features = ["default", "textlayout"] }
svgtypes = "0.15.3"
toml = "0.8.23"
unicode-segmentation = "1.12.0"
urlencoding = "2.1.3"
