[package]
name = "chronux"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.5.40"
clap_derive = "4.5.40"
csscolorparser = "0.7.2"
env_logger = "0.11.8"
indicatif = { version = "0.17.11", features = ["rayon"] }
log = "0.4.27"
ndarray = "0.16.1"
pariter = "0.5.1"
rayon = "1.10.0"
roots = "0.0.8"
roxmltree = "0.20.0"
rsmpeg = { version = "0.16.1", features = [
    "ffmpeg7",
    "link_vcpkg_ffmpeg",
], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
simplecss = "0.2.2"
skia-safe = { version = "0.86.1", features = ["default", "textlayout"] }
svgtypes = "0.15.3"
toml = "0.8.23"
unicode-segmentation = "1.12.0"
yuv = "0.8.5"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg.git"
# Change the triplet according to your build target
dependencies = ["ffmpeg:x64-windows-static-md"]
# Use vcpkg's master branch
branch = "master"
