[package]
name = "chronux"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.5.40"
clap_derive = "4.5.40"
csscolorparser = "0.7.2"
env_logger = "0.11.8"
indicatif = "0.17.11"
log = "0.4.27"
ffmpeg-next = "7.1.0"
rayon = "1.10.0"
roots = "0.0.8"
roxmltree = "0.20.0"
serde = { version = "1.0.219", features = ["derive"] }
simplecss = "0.2.2"
skia-safe = { version = "0.86.1", features = ["default", "textlayout"] }
svgtypes = "0.15.3"
toml = "0.8.23"
video-rs = { version = "0.10.3", features = ["ndarray"] }
ndarray = "0.16.1"
